stages:
  - build
  - tf_validate
  - tf_plan
  - tf_apply

.terraform_job:
  image:
    name: hashicorp/terraform:1.16.5
    entrypoint: [""]
  before_script:
    - apk add --no-cache make
    - make init

build:
  stage: build
  image: golang:1.27-alpine
  before_script:
    - apk add --no-cache make zip
  script:
    - make prepare_artifacts
  artifacts:
    paths:
      - terraform/build/

tf_validate:
  extends: .terraform_job
  stage: tf_validate
  script:
    - make validate
  dependencies:
    - build

tf_plan:
  extends: .terraform_job
  stage: tf_plan
  script:
    - make plan
  dependencies:
    - build
    - tf_validate
  only:
    - master
    - develop
  artifacts:
    paths:
      - terraform/planfile

tf_apply:
  extends: .terraform_job
  stage: tf_apply
  script:
    - make apply
  dependencies:
    - build
    - tf_plan
  only:
    - master
    - develop
  when: manual
